            answer: "3/6"
            explanation: "Even numbers: {2,4,6} — 3 outcomes out of 6. P = 3/6 = 1/2."
            difficulty: 1
          - question: "A bag contains 4 red and 6 blue balls. P(drawing a red ball):"
            options: ["4/6", "2/5", "3/5", "4/10"]
            answer: "4/10"
            explanation: "P(red) = 4/(4+6) = 4/10 = 2/5."
            difficulty: 1

      - id: probability-applications
        title: Probability Applications
        sequence: 2
        estimated_minutes: 40
        prerequisites: [basic-probability]
        concepts:
          - Card experiments — suits, ranks, face cards
          - Coin experiments — single and multiple coins
          - Mutually exclusive events
          - Empirical (experimental) probability
        youtube_search_hints:
          - "probability cards coins experiments class 9 CBSE"
        questions:
          - question: "A card is drawn from 52 cards. P(a black face card):"
            options: ["3/26", "6/52", "1/4", "3/13"]
            answer: "3/26"
            explanation: "Black face cards = {J♠,Q♠,K♠,J♣,Q♣,K♣} = 6. P = 6/52 = 3/26."
            difficulty: 2
          - question: "Three coins are tossed. P(exactly 2 heads):"
            options: ["1/8", "2/8", "3/8", "4/8"]
            answer: "3/8"
            explanation: "Sample space = 8. Favourable: {HHT,HTH,THH} = 3. P = 3/8."
            difficulty: 2
