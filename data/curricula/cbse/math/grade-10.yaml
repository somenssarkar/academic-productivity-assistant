  # -------------------------------------------------------------------------
  - id: trigonometric-ratios
    title: Trigonometric Ratios
    sequence: 10
    topics:
      - id: basic-trig-ratios
        title: Sine, Cosine and Tangent
        sequence: 1
        estimated_minutes: 40
        prerequisites: [triangles.pythagoras-theorem]
        concepts:
          - sin θ = opposite/hypotenuse
          - cos θ = adjacent/hypotenuse
          - tan θ = opposite/adjacent = sin θ/cos θ
          - cosec θ, sec θ, cot θ as reciprocals
        youtube_search_hints:
          - "trigonometric ratios sin cos tan class 10 CBSE definition"
        questions:
          - question: "In a right triangle, sin θ = 3/5. Then cos θ ="
            options: ["4/5", "3/4", "5/4", "5/3"]
            answer: "4/5"
            explanation: "If sin θ = 3/5, hyp=5, opp=3. adj = √(25−9) = 4. cos θ = 4/5."
            difficulty: 1
          - question: "If tan θ = 7/24, then sin θ ="
            options: ["7/25", "24/25", "7/24", "25/24"]
            answer: "7/25"
            explanation: "tan θ = 7/24 → opp=7, adj=24, hyp=25. sin θ = 7/25."
            difficulty: 2

      - id: trig-ratios-complementary
        title: Trigonometric Ratios of Complementary Angles
        sequence: 2
        estimated_minutes: 35
        prerequisites: [basic-trig-ratios]
        concepts:
          - sin(90°−θ) = cos θ; cos(90°−θ) = sin θ
          - tan(90°−θ) = cot θ; cot(90°−θ) = tan θ
          - sec(90°−θ) = cosec θ; cosec(90°−θ) = sec θ
          - Simplifying expressions using complementary relations
        youtube_search_hints:
          - "trigonometric ratios complementary angles class 10 CBSE"
        questions:
          - question: "The value of sin 35° / cos 55° is:"
            options: ["0", "1", "sin 35°", "undefined"]
            answer: "1"
            explanation: "cos 55° = cos(90°−35°) = sin 35°. So sin 35°/cos 55° = sin 35°/sin 35° = 1."
            difficulty: 1

  # -------------------------------------------------------------------------
  - id: t-ratios-particular-angles
    title: T-Ratios of Some Particular Angles
    sequence: 11
    topics:
      - id: standard-angle-values
        title: Values of Trig Ratios at 0°, 30°, 45°, 60°, 90°
        sequence: 1
        estimated_minutes: 35
        prerequisites: [trigonometric-ratios.basic-trig-ratios]
        concepts:
          - sin 0°=0, sin 30°=1/2, sin 45°=1/√2, sin 60°=√3/2, sin 90°=1
          - cos and tan values at standard angles
          - Undefined values — tan 90°, cosec 0°
          - Using the "1, √3, 2" triangle for 30°-60°-90°
        youtube_search_hints:
          - "trigonometric values 30 45 60 class 10 CBSE table"
        questions:
          - question: "The value of sin 60° × cos 30° − cos 60° × sin 30° is:"
            options: ["0", "1/2", "√3/2", "1"]
            answer: "1/2"
            explanation: "(√3/2)(√3/2) − (1/2)(1/2) = 3/4 − 1/4 = 2/4 = 1/2."
            difficulty: 2
          - question: "tan 45° + cos 60° − sin 30° ="
            options: ["1", "0", "1/2", "2"]
            answer: "1"
            explanation: "1 + 1/2 − 1/2 = 1."
            difficulty: 1

  # -------------------------------------------------------------------------
  - id: trigonometric-identities
    title: Trigonometric Identities
    sequence: 12
    topics:
      - id: pythagorean-identities
        title: Pythagorean Trigonometric Identities
        sequence: 1
        estimated_minutes: 45
        prerequisites: [trigonometric-ratios.basic-trig-ratios]
        concepts:
          - sin²θ + cos²θ = 1
          - 1 + tan²θ = sec²θ
          - 1 + cot²θ = cosec²θ
          - Deriving one ratio from another using identities
        youtube_search_hints:
          - "trigonometric identities class 10 CBSE sin cos proof"
        questions:
          - question: "If sin θ = 12/13, find the value of cos²θ:"
            options: ["5/13", "25/169", "144/169", "1/169"]
            answer: "25/169"
            explanation: "cos²θ = 1 − sin²θ = 1 − 144/169 = 25/169."
            difficulty: 1
          - question: "Simplify: (1 − sin²θ)/cos θ:"
            options: ["cos θ", "sin θ", "tan θ", "1"]
            answer: "cos θ"
            explanation: "1 − sin²θ = cos²θ. So cos²θ/cos θ = cos θ."
            difficulty: 2

