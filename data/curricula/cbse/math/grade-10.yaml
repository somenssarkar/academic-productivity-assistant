        youtube_search_hints:
          - "combination of solids class 10 CBSE recasting melting"
        questions:
          - question: "A toy is a cone on top of a cylinder, both with r=3cm. Cylinder h=4cm, cone h=4cm. Volume:"
            options: ["150.72 cm³", "113.04 cm³", "113+37.68 cm³", "188.4 cm³"]
            answer: "113+37.68 cm³"
            explanation: "V_cyl = π×9×4 = 113.04 cm³. V_cone = (1/3)×π×9×4 = 37.68 cm³. Total ≈ 150.72 cm³."
            difficulty: 2

