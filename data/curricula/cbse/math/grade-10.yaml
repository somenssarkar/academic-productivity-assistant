        youtube_search_hints:
          - "area of segment circle class 10 CBSE minor major"
        questions:
          - question: "Area of minor segment with r=10cm and angle 60°. Area of equilateral triangle with side 10cm is 25√3 cm²."
            options: ["(100π/6 − 25√3) cm²", "(50π − 25√3) cm²", "25√3 cm²", "100π/6 cm²"]
            answer: "(100π/6 − 25√3) cm²"
            explanation: "Area = sector area − triangle area = (60/360)πr² − 25√3 = 100π/6 − 25√3 cm²."
            difficulty: 3

