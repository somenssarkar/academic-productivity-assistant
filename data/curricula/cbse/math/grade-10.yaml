  - id: probability
    title: Probability
    sequence: 18
    topics:
      - id: classical-probability
        title: Classical Probability
        sequence: 1
        estimated_minutes: 40
        prerequisites: []
        concepts:
          - P(E) = Number of favourable outcomes / Total outcomes
          - Equally likely outcomes assumption
          - P(E) lies between 0 and 1
          - P(E) + P(Ē) = 1 (complementary events)
          - Sure event P=1, impossible event P=0
        youtube_search_hints:
          - "probability class 10 CBSE classical basic"
        questions:
          - question: "A card is drawn from a well-shuffled deck of 52 cards. P(king) ="
            options: ["1/13", "4/13", "1/52", "1/4"]
            answer: "1/13"
            explanation: "4 kings in 52 cards. P(king) = 4/52 = 1/13."
            difficulty: 1
          - question: "A bag has 3 red, 4 blue, 5 green balls. P(not red) ="
            options: ["3/12", "9/12", "4/12", "1/4"]
            answer: "9/12"
            explanation: "P(not red) = 1 − P(red) = 1 − 3/12 = 9/12 = 3/4."
            difficulty: 1

      - id: dice-cards-probability
        title: Probability with Dice, Cards and Coins
        sequence: 2
        estimated_minutes: 45
        prerequisites: [classical-probability]
        concepts:
          - Sample space for single/two dice
          - Sample space for cards — suits, ranks, face cards
          - Probability with multiple coins
          - Mutually exclusive and exhaustive events
        youtube_search_hints:
          - "probability dice cards coins class 10 CBSE sample space"
        questions:
          - question: "Two dice are thrown. P(sum = 7) ="
            options: ["1/6", "7/36", "6/36", "5/36"]
            answer: "6/36"
            explanation: "Favourable: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) = 6 outcomes. P = 6/36 = 1/6."
            difficulty: 2
          - question: "From a deck, P(face card) ="
            options: ["3/52", "12/52", "4/52", "16/52"]
            answer: "12/52"
            explanation: "Face cards = Jack, Queen, King in each of 4 suits = 12. P = 12/52 = 3/13."
            difficulty: 1
          - question: "P(at least one head) when two coins are tossed:"
            options: ["1/4", "1/2", "3/4", "1"]
            answer: "3/4"
            explanation: "P(at least one head) = 1 − P(no head) = 1 − 1/4 = 3/4."
            difficulty: 2
