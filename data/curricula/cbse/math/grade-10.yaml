  - id: heights-and-distances
    title: Heights and Distances
    sequence: 13
    topics:
      - id: angle-elevation-depression
        title: Angle of Elevation and Depression
        sequence: 1
        estimated_minutes: 40
        prerequisites: [t-ratios-particular-angles.standard-angle-values, trigonometric-identities.pythagorean-identities]
        concepts:
          - Angle of elevation — looking upward from horizontal
          - Angle of depression — looking downward from horizontal
