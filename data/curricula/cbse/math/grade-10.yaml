  - id: statistics-grouped-data
    title: Mean, Median, Mode of Grouped Data
    sequence: 17
    topics:
      - id: mean-grouped
        title: Mean of Grouped Data
        sequence: 1
        estimated_minutes: 45
        prerequisites: []
        concepts:
          - Direct method — Mean = Σfₓ / Σf
          - Assumed mean method (deviation method) — d = x − a
          - Step deviation method — u = (x − a)/h
          - Choosing the most efficient method
        youtube_search_hints:
          - "mean grouped data assumed mean step deviation class 10 CBSE"
        questions:
          - question: "For a frequency distribution, Σf = 40 and Σfx = 800. The mean is:"
            options: ["20", "40", "800", "32000"]
            answer: "20"
            explanation: "Mean = Σfx / Σf = 800 / 40 = 20."
            difficulty: 1
          - question: "In the step deviation method, u = (x − a)/h. If a=25 and h=10 and Σfu/Σf = 1.2, then mean ="
            options: ["25", "37", "12", "36"]
            answer: "37"
            explanation: "Mean = a + (Σfu/Σf) × h = 25 + 1.2 × 10 = 25 + 12 = 37."
            difficulty: 2

      - id: median-mode-grouped
        title: Median and Mode of Grouped Data
        sequence: 2
        estimated_minutes: 45
        prerequisites: [mean-grouped]
        concepts:
          - Median = l + [(n/2 − cf)/f] × h
          - Mode = l + [(f₁ − f₀)/(2f₁ − f₀ − f₂)] × h
          - Ogive (cumulative frequency curve)
          - Reading median from ogive
        youtube_search_hints:
          - "median mode grouped data ogive class 10 CBSE"
        questions:
          - question: "In the median formula, 'cf' refers to:"
            options: ["Class frequency", "Cumulative frequency before median class", "Total frequency", "Class width"]
            answer: "Cumulative frequency before median class"
            explanation: "cf is the cumulative frequency of all classes preceding the median class."
            difficulty: 1
          - question: "The modal class is the class with:"
            options: ["Highest cumulative frequency", "Highest frequency", "Middle frequency", "Lowest class interval"]
            answer: "Highest frequency"
            explanation: "Modal class has the maximum frequency in the distribution."
            difficulty: 1

      - id: ogive
        title: Cumulative Frequency Graph (Ogive)
        sequence: 3
        estimated_minutes: 40
        prerequisites: [median-mode-grouped]
        concepts:
          - Less-than ogive and more-than ogive
          - Plotting cumulative frequency vs upper class boundary
          - Finding median graphically — intersection of the two ogives
          - Percentiles and quartiles from ogive
        youtube_search_hints:
          - "ogive cumulative frequency graph class 10 CBSE median graphically"
        questions:
          - question: "The median from a less-than ogive is found by drawing a horizontal line from:"
            options: ["Σf", "Σf/2", "The modal class", "The upper boundary"]
            answer: "Σf/2"
            explanation: "Locate Σf/2 on the y-axis, draw horizontal to ogive, then drop perpendicular to x-axis for median."
            difficulty: 2

