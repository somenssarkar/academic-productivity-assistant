curriculum:
  board: CBSE
  subject: math
  grade: 10
  language: English

chapters:

  # -------------------------------------------------------------------------
  - id: real-numbers
    title: Real Numbers
    sequence: 1
    topics:
      - id: euclids-division-lemma
        title: Euclid's Division Lemma and HCF
        sequence: 1
        estimated_minutes: 45
        prerequisites: []
        concepts:
          - Euclid's Division Lemma — a = bq + r, 0 ≤ r < b
          - Euclid's Division Algorithm for HCF
          - HCF of two or more numbers using the algorithm
        youtube_search_hints:
          - "Euclid division lemma HCF class 10 CBSE"
        questions:
          - question: "Using Euclid's algorithm, the HCF of 56 and 98 is:"
            options: ["7", "14", "28", "56"]
            answer: "14"
            explanation: "98 = 56×1 + 42; 56 = 42×1 + 14; 42 = 14×3 + 0. HCF = 14."
            difficulty: 2
          - question: "Euclid's Division Lemma states that for integers a and b (b>0), there exist unique q and r such that:"
            options: ["a = bq + r, 0 < r ≤ b", "a = bq + r, 0 ≤ r < b", "b = aq + r, 0 ≤ r < a", "a = bq − r, 0 ≤ r < b"]
            answer: "a = bq + r, 0 ≤ r < b"
            explanation: "The lemma precisely states a = bq + r where remainder r satisfies 0 ≤ r < b."
            difficulty: 1

      - id: fundamental-theorem
        title: Fundamental Theorem of Arithmetic
        sequence: 2
        estimated_minutes: 40
        prerequisites: [euclids-division-lemma]
        concepts:
          - Every composite number has a unique prime factorisation
          - HCF and LCM using prime factorisation
          - HCF × LCM = Product of two numbers
          - Applications — HCF/LCM word problems
        youtube_search_hints:
          - "fundamental theorem of arithmetic class 10 HCF LCM"
        questions:
          - question: "The HCF of 96 and 404 is 4. Their LCM is:"
            options: ["9494", "9696", "9696", "9898"]
            answer: "9696"
            explanation: "HCF × LCM = Product. LCM = (96 × 404)/4 = 38784/4 = 9696."
            difficulty: 2
          - question: "Which of the following is the prime factorisation of 3825?"
            options: ["3² × 5² × 17", "3 × 5² × 51", "3² × 425", "5² × 153"]
            answer: "3² × 5² × 17"
            explanation: "3825 = 3 × 1275 = 3 × 3 × 425 = 9 × 25 × 17 = 3² × 5² × 17."
            difficulty: 2

      - id: irrational-numbers
        title: Irrational Numbers and Decimal Expansions
        sequence: 3
        estimated_minutes: 40
        prerequisites: [fundamental-theorem]
        concepts:
          - Proof that √p is irrational for prime p
          - Terminating decimals — denominator has only 2ⁿ5ᵐ factors
          - Non-terminating repeating decimals — other prime factors in denominator
          - Identifying rational vs irrational from decimal form
        youtube_search_hints:
          - "irrational numbers proof decimal expansion class 10 CBSE"
        questions:
          - question: "The decimal expansion of 17/8 is:"
            options: ["Terminating", "Non-terminating repeating", "Non-terminating non-repeating", "Cannot be determined"]
            answer: "Terminating"
            explanation: "8 = 2³. Denominator has only factors of 2. So 17/8 = 2.125 (terminating)."
            difficulty: 1
          - question: "Which decimal expansion is non-terminating repeating?"
            options: ["1/4", "7/25", "11/6", "3/8"]
            answer: "11/6"
            explanation: "6 = 2 × 3. Since 3 is a factor other than 2 and 5, 11/6 is non-terminating repeating."
            difficulty: 2

  # -------------------------------------------------------------------------
  - id: polynomials
    title: Polynomials
    sequence: 2
    topics:
      - id: zeros-of-polynomials
        title: Zeros of a Polynomial
        sequence: 1
        estimated_minutes: 40
        prerequisites: []
        concepts:
          - Geometrical meaning of zeros — x-intercepts of the graph
          - Linear polynomial — 1 zero
          - Quadratic polynomial — at most 2 zeros
          - Cubic polynomial — at most 3 zeros
        youtube_search_hints:
          - "zeros of polynomial geometrical meaning class 10 CBSE"
        questions:
          - question: "The number of zeros of the polynomial p(x) = (x−2)(x+3) is:"
            options: ["0", "1", "2", "3"]
            answer: "2"
            explanation: "p(x) = 0 when x = 2 or x = −3. Two zeros."
            difficulty: 1
          - question: "A quadratic polynomial can have at most:"
            options: ["1 zero", "2 zeros", "3 zeros", "infinitely many zeros"]
            answer: "2 zeros"
            explanation: "A degree-n polynomial has at most n zeros. Degree 2 → at most 2 zeros."
            difficulty: 1

      - id: relationship-zeros-coefficients
        title: Relationship Between Zeros and Coefficients
        sequence: 2
        estimated_minutes: 45
        prerequisites: [zeros-of-polynomials]
        concepts:
          - For ax² + bx + c with zeros α, β — sum α+β = −b/a, product αβ = c/a
          - Forming a quadratic from given zeros — x² − (sum)x + (product)
          - For cubic ax³+bx²+cx+d with zeros α,β,γ — sum=−b/a, sum of products=c/a, product=−d/a
        youtube_search_hints:
          - "zeros coefficients relationship quadratic cubic class 10 CBSE"
        questions:
          - question: "For p(x) = 2x² − 5x + 3, the sum of zeros is:"
            options: ["5/2", "−5/2", "3/2", "−3/2"]
            answer: "5/2"
            explanation: "Sum of zeros = −b/a = −(−5)/2 = 5/2."
            difficulty: 1
          - question: "A quadratic polynomial whose zeros are 3 and −4 is:"
            options: ["x² − x − 12", "x² + x − 12", "x² − x + 12", "x² + x + 12"]
            answer: "x² + x − 12"
            explanation: "Sum = 3+(−4) = −1, Product = 3×(−4) = −12. Polynomial = x² −(−1)x + (−12) = x² + x − 12."
            difficulty: 2

      - id: division-algorithm
        title: Division Algorithm for Polynomials
        sequence: 3
        estimated_minutes: 45
        prerequisites: [relationship-zeros-coefficients]
        concepts:
          - Dividend = Divisor × Quotient + Remainder
          - Performing long division of polynomials
          - Finding remaining zeros when one zero is known
          - Verification using the algorithm
        youtube_search_hints:
          - "division algorithm polynomials class 10 long division"
        questions:
          - question: "If on dividing x³ − 3x² + x + 2 by (x−2), the remainder is 0, then (x−2) is:"
            options: ["A factor", "Not a factor", "The quotient", "A zero"]
            answer: "A factor"
            explanation: "Remainder = 0 means (x−2) divides the polynomial exactly — it is a factor."
            difficulty: 1
          - question: "Divide 3x² + x − 1 by (x + 1). The remainder is:"
            options: ["0", "1", "−1", "3"]
            answer: "1"
            explanation: "By remainder theorem, substitute x = −1: 3(1)+(−1)−1 = 3−1−1 = 1."
            difficulty: 2

  # -------------------------------------------------------------------------
  - id: linear-equations-two-variables
    title: Linear Equations in Two Variables
    sequence: 3
    topics:
      - id: graphical-method
        title: Graphical Method of Solution
        sequence: 1
        estimated_minutes: 40
        prerequisites: []
        concepts:
          - Representing a linear equation as a straight line
          - Consistent system — unique solution (lines intersect)
          - Inconsistent system — no solution (parallel lines)
          - Dependent system — infinite solutions (coincident lines)
        youtube_search_hints:
          - "graphical method linear equations class 10 CBSE consistent inconsistent"
        questions:
          - question: "Lines 2x + y = 5 and 4x + 2y = 10 are:"
            options: ["Intersecting", "Parallel", "Coincident", "Perpendicular"]
            answer: "Coincident"
            explanation: "Second equation = 2 × first equation. They represent the same line — infinitely many solutions."
            difficulty: 2
          - question: "A pair of linear equations has a unique solution when their lines are:"
            options: ["Parallel", "Coincident", "Intersecting at one point", "Perpendicular only"]
            answer: "Intersecting at one point"
            explanation: "Unique solution means exactly one intersection point."
            difficulty: 1

      - id: algebraic-methods
        title: Algebraic Methods — Substitution and Elimination
        sequence: 2
        estimated_minutes: 45
        prerequisites: [graphical-method]
        concepts:
          - Substitution method — express one variable in terms of the other
          - Elimination method — multiply and add/subtract to eliminate a variable
          - Cross-multiplication method
          - Choosing the most efficient method
        youtube_search_hints:
          - "substitution elimination method linear equations class 10"
        questions:
          - question: "Solve by elimination: x + y = 14 and x − y = 4. Value of x:"
            options: ["5", "9", "10", "7"]
            answer: "9"
            explanation: "Adding: 2x = 18, x = 9."
            difficulty: 1
          - question: "Solve by substitution: 2x + y = 11 and x + 2y = 10. Value of y:"
            options: ["2", "3", "4", "5"]
            answer: "3"
            explanation: "From eq1: y = 11−2x. Sub in eq2: x + 2(11−2x) = 10 → x+22−4x=10 → −3x=−12 → x=4. y=11−8=3."
            difficulty: 2

      - id: word-problems-two-vars
        title: Word Problems on Pair of Linear Equations
        sequence: 3
        estimated_minutes: 45
        prerequisites: [algebraic-methods]
        concepts:
          - Framing two equations from word problems
          - Age problems with two unknowns
          - Speed, distance, time problems
          - Digit problems (tens and units)
        youtube_search_hints:
          - "word problems linear equations two variables class 10 age speed"
        questions:
          - question: "A two-digit number is 3 more than 4 times the sum of its digits. If 18 is added, the digits reverse. The number is:"
            options: ["35", "24", "15", "42"]
            answer: "35"
            explanation: "Let tens = x, units = y. 10x+y = 4(x+y)+3 → 6x−3y=3. Reversed: 10y+x = 10x+y+18 → 9y−9x=18 → y−x=2. Solving: x=3, y=5. Number = 35."
            difficulty: 3

  # -------------------------------------------------------------------------
  - id: quadratic-equations
    title: Quadratic Equations
    sequence: 4
    topics:
      - id: standard-form
        title: Quadratic Equations — Standard Form
        sequence: 1
        estimated_minutes: 40
        prerequisites: []
        concepts:
          - Standard form ax² + bx + c = 0, where a ≠ 0
          - Identifying a, b, c coefficients
          - Checking if a given value is a solution (root)
          - Converting equations to standard form
        youtube_search_hints:
          - "quadratic equations standard form class 10 CBSE introduction"
        questions:
          - question: "In 3x² − 5x + 2 = 0, the value of 'a' is:"
            options: ["−5", "2", "3", "1"]
            answer: "3"
            explanation: "In ax² + bx + c = 0, 'a' is the coefficient of x². Here a = 3."
            difficulty: 1
          - question: "Which of the following is a quadratic equation?"
            options: ["x³ + 2x = 0", "x + 1/x = 2", "x² + 1/x = 5", "(x+1)(x−1) = x² + 5"]
            answer: "x + 1/x = 2"
            explanation: "x + 1/x = 2 → x² − 2x + 1 = 0 after multiplying by x. This is quadratic."
            difficulty: 2

      - id: factoring-method
        title: Solving by Factorisation
        sequence: 2
        estimated_minutes: 45
        prerequisites: [standard-form]
        concepts:
          - Splitting the middle term
          - Zero product property
          - Factorising with common factors first
          - Equations reducible to quadratic form
        youtube_search_hints:
          - "quadratic equations factorisation method class 10 CBSE splitting middle term"
        questions:
          - question: "Solve x² + 5x + 6 = 0 by factorisation:"
            options: ["x = 2, 3", "x = −2, −3", "x = −2, 3", "x = 2, −3"]
            answer: "x = −2, −3"
            explanation: "x² + 5x + 6 = (x+2)(x+3) = 0. So x = −2 or x = −3."
            difficulty: 1
          - question: "Solve 2x² − 5x + 3 = 0:"
            options: ["x = 1, 3/2", "x = −1, −3/2", "x = 1, −3/2", "x = 3, 1/2"]
            answer: "x = 1, 3/2"
            explanation: "2x²−5x+3 = (2x−3)(x−1) = 0. So x = 3/2 or x = 1."
            difficulty: 2

      - id: completing-the-square
        title: Completing the Square Method
        sequence: 3
        estimated_minutes: 45
        prerequisites: [factoring-method]
        concepts:
          - Converting ax² + bx + c to a(x + h)² + k form
          - Steps — make coefficient of x² = 1, add (b/2a)² to both sides
          - Solving equations by completing the square
          - Deriving the quadratic formula
        youtube_search_hints:
          - "completing the square method quadratic class 10 CBSE"
        questions:
          - question: "Solve x² + 4x − 5 = 0 by completing the square:"
            options: ["x = 1, −5", "x = −1, 5", "x = 1, 5", "x = −1, −5"]
            answer: "x = 1, −5"
            explanation: "(x+2)² = 9. x+2 = ±3. x = 1 or x = −5."
            difficulty: 2
          - question: "While completing the square for 2x² + 8x + 6, what number is added to both sides?"
            options: ["4", "8", "16", "2"]
            answer: "4"
            explanation: "First divide by 2: x²+4x+3. Add (4/2)² = 4 to both sides."
            difficulty: 2

      - id: quadratic-formula
        title: Quadratic Formula and Discriminant
        sequence: 4
        estimated_minutes: 45
        prerequisites: [completing-the-square]
        concepts:
          - Quadratic formula — x = (−b ± √(b²−4ac)) / 2a
          - Discriminant D = b² − 4ac
          - Nature of roots — D > 0 (two distinct real), D = 0 (equal real), D < 0 (no real roots)
          - Applications in word problems
        youtube_search_hints:
          - "quadratic formula discriminant nature of roots class 10 CBSE"
        questions:
          - question: "For 2x² − 4x + 3 = 0, the discriminant is:"
            options: ["8", "−8", "16", "−16"]
            answer: "−8"
            explanation: "D = b²−4ac = (−4)²−4(2)(3) = 16−24 = −8."
            difficulty: 1
          - question: "The roots of x² − 6x + 9 = 0 are:"
            options: ["Real and distinct", "Real and equal", "Not real", "Irrational"]
            answer: "Real and equal"
            explanation: "D = 36 − 36 = 0. Equal roots. Both roots = 3."
            difficulty: 1
          - question: "Using the quadratic formula, solve x² − 3x − 10 = 0:"
            options: ["x = 5, −2", "x = −5, 2", "x = 5, 2", "x = −5, −2"]
            answer: "x = 5, −2"
            explanation: "D = 9+40=49. x = (3±7)/2. So x = 5 or x = −2."
            difficulty: 2

  # -------------------------------------------------------------------------
  - id: arithmetic-progressions
    title: Arithmetic Progressions
    sequence: 5
    topics:
      - id: intro-ap
        title: Introduction to Arithmetic Progressions
        sequence: 1
        estimated_minutes: 35
        prerequisites: []
        concepts:
          - Definition — AP is a sequence with constant common difference d
          - General form — a, a+d, a+2d, ...
          - Finding common difference d
          - nth term formula — aₙ = a + (n−1)d
        youtube_search_hints:
          - "arithmetic progression introduction nth term class 10 CBSE"
        questions:
          - question: "The 10th term of AP: 3, 7, 11, 15, ... is:"
            options: ["39", "43", "47", "51"]
            answer: "39"
            explanation: "a=3, d=4. a₁₀ = 3 + 9×4 = 3 + 36 = 39."
            difficulty: 1
          - question: "Which term of AP 5, 11, 17, 23, ... is 95?"
            options: ["14th", "15th", "16th", "17th"]
            answer: "16th"
            explanation: "aₙ = 5 + (n−1)×6 = 95. (n−1)×6 = 90. n−1 = 15. n = 16."
            difficulty: 2

      - id: sum-of-ap
        title: Sum of First n Terms of an AP
        sequence: 2
        estimated_minutes: 45
        prerequisites: [intro-ap]
        concepts:
          - Sₙ = n/2 × [2a + (n−1)d]
          - Sₙ = n/2 × (first term + last term)
          - Relationship between aₙ and Sₙ — aₙ = Sₙ − Sₙ₋₁
          - Word problems on sum of AP
        youtube_search_hints:
          - "sum of AP arithmetic progression class 10 CBSE formula word problems"
        questions:
          - question: "Sum of first 20 terms of AP: 1, 3, 5, 7, ... is:"
            options: ["200", "400", "210", "420"]
            answer: "400"
            explanation: "a=1, d=2. S₂₀ = 20/2 × [2(1)+19(2)] = 10 × 40 = 400."
            difficulty: 1
          - question: "If Sₙ = 3n² + 5n, find the 10th term:"
            options: ["57", "63", "65", "58"]
            answer: "63"
            explanation: "a₁₀ = S₁₀ − S₉ = (300+50) − (243+45) = 350 − 288 = 62. Note: a₁₀ = S₁₀ − S₉."
            difficulty: 3

  # -------------------------------------------------------------------------
  - id: coordinate-geometry
    title: Co-ordinate Geometry
    sequence: 6
    topics:
      - id: distance-formula
        title: Distance Formula
        sequence: 1
        estimated_minutes: 40
        prerequisites: []
        concepts:
          - Distance between (x₁,y₁) and (x₂,y₂) = √[(x₂−x₁)²+(y₂−y₁)²]
          - Distance from origin to (x, y) = √(x²+y²)
          - Proving collinearity of three points
          - Type of triangle/quadrilateral from coordinates
        youtube_search_hints:
          - "distance formula coordinate geometry class 10 CBSE"
        questions:
          - question: "Distance between points (−3, 4) and (3, −4) is:"
            options: ["8", "10", "6", "√80"]
            answer: "10"
            explanation: "d = √[(3−(−3))²+(−4−4)²] = √[36+64] = √100 = 10."
            difficulty: 1
          - question: "The points (1,1), (−2,7), (3,−3) are:"
            options: ["Vertices of a triangle", "Collinear", "Form a right triangle", "Form an equilateral triangle"]
            answer: "Collinear"
            explanation: "Slope from (1,1) to (−2,7) = −2; from (1,1) to (3,−3) = −2. Same slope → collinear."
            difficulty: 2

      - id: section-formula
        title: Section Formula and Midpoint
        sequence: 2
        estimated_minutes: 40
        prerequisites: [distance-formula]
        concepts:
          - Section formula (internal division) — ((m·x₂+n·x₁)/(m+n), (m·y₂+n·y₁)/(m+n))
          - Midpoint formula — ((x₁+x₂)/2, (y₁+y₂)/2)
          - Trisection of a line segment
          - Centroid of a triangle = ((x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3)
        youtube_search_hints:
          - "section formula midpoint coordinate geometry class 10 CBSE"
        questions:
          - question: "The midpoint of segment joining (2,3) and (4,7) is:"
            options: ["(3,5)", "(6,10)", "(2,4)", "(3,4)"]
            answer: "(3,5)"
            explanation: "Midpoint = ((2+4)/2, (3+7)/2) = (3, 5)."
            difficulty: 1

      - id: area-of-triangle
        title: Area of a Triangle Using Coordinates
        sequence: 3
        estimated_minutes: 40
        prerequisites: [section-formula]
        concepts:
          - Area = ½|x₁(y₂−y₃) + x₂(y₃−y₁) + x₃(y₁−y₂)|
          - Area = 0 means collinear points
          - Finding unknown coordinate given area
        youtube_search_hints:
          - "area of triangle coordinates class 10 CBSE formula"
        questions:
          - question: "Area of triangle with vertices (1,1), (4,1), (4,5):"
            options: ["6 sq units", "4 sq units", "8 sq units", "3 sq units"]
            answer: "6 sq units"
            explanation: "Area = ½|1(1−5)+4(5−1)+4(1−1)| = ½|−4+16+0| = ½×12 = 6 sq units."
            difficulty: 2

  # -------------------------------------------------------------------------
  - id: triangles
    title: Triangles
    sequence: 7
    topics:
      - id: similarity
        title: Similar Triangles and Criteria
        sequence: 1
        estimated_minutes: 45
        prerequisites: []
        concepts:
          - Similarity criteria — AA, SSS, SAS
          - Corresponding sides proportional, angles equal
          - Basic Proportionality Theorem (Thales' theorem)
          - Converse of BPT
        youtube_search_hints:
          - "similar triangles criteria AA SSS SAS class 10 CBSE"
        questions:
          - question: "In △ABC and △DEF, ∠A = ∠D and ∠B = ∠E. By which criterion are they similar?"
            options: ["SSS", "SAS", "AA", "RHS"]
            answer: "AA"
            explanation: "Two pairs of equal angles → AA (Angle-Angle) similarity criterion."
            difficulty: 1
          - question: "In △ABC, DE ∥ BC where D is on AB and E is on AC. If AD/DB = 3/5, then AE/EC ="
            options: ["5/3", "3/5", "3/8", "5/8"]
            answer: "3/5"
            explanation: "By BPT (Thales' theorem), AD/DB = AE/EC. So AE/EC = 3/5."
            difficulty: 2

      - id: pythagoras-theorem
        title: Pythagoras Theorem
        sequence: 2
        estimated_minutes: 45
        prerequisites: [similarity]
        concepts:
          - Pythagoras theorem — In right triangle, c² = a² + b²
          - Proof using similar triangles
          - Converse of Pythagoras theorem
          - Application in real problems
        youtube_search_hints:
          - "Pythagoras theorem proof class 10 CBSE converse"
        questions:
          - question: "In a right triangle, if legs are 8 cm and 15 cm, the hypotenuse is:"
            options: ["16 cm", "17 cm", "18 cm", "23 cm"]
            answer: "17 cm"
            explanation: "c = √(8²+15²) = √(64+225) = √289 = 17 cm."
            difficulty: 1
          - question: "The sides 7, 24, 25 form a right triangle because:"
            options: ["7+24=31>25", "7²+24²=25²", "They are integers", "25 is the largest"]
            answer: "7²+24²=25²"
            explanation: "49 + 576 = 625 = 25². Converse of Pythagoras theorem confirms it is a right triangle."
            difficulty: 1

      - id: areas-similar-triangles
        title: Areas of Similar Triangles
        sequence: 3
        estimated_minutes: 40
        prerequisites: [similarity]
        concepts:
          - Ratio of areas = square of ratio of corresponding sides
          - Area(△ABC)/Area(△DEF) = (AB/DE)² = (BC/EF)² = (AC/DF)²
          - Applications combining with Pythagoras
        youtube_search_hints:
          - "areas similar triangles ratio class 10 CBSE"
        questions:
          - question: "If △ABC ~ △DEF and AB/DE = 2/3, then Area(△ABC)/Area(△DEF) ="
            options: ["2/3", "4/9", "√2/√3", "8/27"]
            answer: "4/9"
            explanation: "Ratio of areas = square of ratio of sides = (2/3)² = 4/9."
            difficulty: 1

  # -------------------------------------------------------------------------
  - id: circles
    title: Circles
    sequence: 8
    topics:
      - id: tangent-to-circle
        title: Tangent to a Circle
        sequence: 1
        estimated_minutes: 40
        prerequisites: [triangles.pythagoras-theorem]
        concepts:
          - Tangent — line touching circle at exactly one point
          - Tangent is perpendicular to radius at point of contact
          - Length of tangent from external point
          - Two tangents from an external point are equal
        youtube_search_hints:
          - "tangent to circle class 10 CBSE properties theorem"
        questions:
          - question: "A tangent to a circle is perpendicular to the radius at:"
            options: ["The centre", "Any point", "The point of contact", "The midpoint of arc"]
            answer: "The point of contact"
            explanation: "The radius drawn to the point of tangency is perpendicular to the tangent."
            difficulty: 1
          - question: "Two tangents PA and PB from external point P to a circle with centre O. If PA = 8 cm, PB ="
            options: ["4 cm", "16 cm", "8 cm", "Cannot be determined"]
            answer: "8 cm"
            explanation: "Tangent segments from an external point are equal. PA = PB = 8 cm."
            difficulty: 1

      - id: angle-in-tangent
        title: Angle Between Tangent and Chord
        sequence: 2
        estimated_minutes: 40
        prerequisites: [tangent-to-circle]
        concepts:
          - Angle between tangent and chord = inscribed angle in alternate segment
          - ∠OAP = 90° (tangent-radius)
          - ∠APB for two tangents from external point
          - ∠AOB + ∠APB = 180°
        youtube_search_hints:
          - "tangent chord angle alternate segment theorem class 10"
        questions:
          - question: "PA and PB are tangents from P to a circle with centre O. If ∠APB = 50°, then ∠AOB ="
            options: ["50°", "100°", "130°", "140°"]
            answer: "130°"
            explanation: "∠AOB + ∠APB = 180°. ∠AOB = 180° − 50° = 130°."
            difficulty: 2

  # -------------------------------------------------------------------------
  - id: constructions
    title: Constructions
    sequence: 9
    topics:
