        youtube_search_hints:
          - "angle of elevation depression class 10 CBSE"
        questions:
          - question: "A tower 30 m high casts a shadow 30 m long. The angle of elevation of the sun is:"
            options: ["30°", "45°", "60°", "90°"]
            answer: "45°"
            explanation: "tan θ = height/shadow = 30/30 = 1. θ = 45°."
            difficulty: 1

      - id: word-problems-heights
        title: Word Problems on Heights and Distances
        sequence: 2
        estimated_minutes: 50
        prerequisites: [angle-elevation-depression]
        concepts:
          - Two observation problems (two angles of elevation)
          - Problems with two observers
          - Pole/tower on a building
          - Problems involving angle changes
        youtube_search_hints:
          - "heights distances word problems class 10 CBSE two angles"
        questions:
          - question: "From a point 20 m away from a building, the angle of elevation of the top is 60°. Height of building:"
            options: ["20√3 m", "20/√3 m", "10√3 m", "40√3 m"]
            answer: "20√3 m"
            explanation: "tan 60° = h/20. √3 = h/20. h = 20√3 m."
            difficulty: 2
          - question: "A man on a cliff observes a boat at angle of depression 30°. If cliff is 60 m high, distance of boat:"
            options: ["60√3 m", "30√3 m", "60/√3 m", "120 m"]
            answer: "60√3 m"
            explanation: "Angle of depression = angle of elevation from boat. tan 30° = 60/d. d = 60/tan 30° = 60√3."
            difficulty: 2

