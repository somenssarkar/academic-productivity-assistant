        title: Cone and Sphere
        sequence: 1
        estimated_minutes: 45
        prerequisites: []
        concepts:
          - Volume of cone = (1/3)πr²h
          - CSA of cone = πrl, TSA = πr(r+l), where l=slant height=√(r²+h²)
          - Volume of sphere = (4/3)πr³
          - Surface area of sphere = 4πr²
          - Hemisphere — volume = (2/3)πr³, CSA = 2πr², TSA = 3πr²
        youtube_search_hints:
          - "volume surface area cone sphere hemisphere class 10 CBSE"
        questions:
          - question: "Volume of a cone with r=3cm and h=4cm (π=3.14):"
            options: ["37.68 cm³", "150.72 cm³", "12.56 cm³", "75.36 cm³"]
            answer: "37.68 cm³"
            explanation: "V = (1/3)×3.14×9×4 = (1/3)×113.04 = 37.68 cm³."
            difficulty: 1
          - question: "Slant height of a cone with r=5cm and h=12cm:"
            options: ["13 cm", "14 cm", "17 cm", "10 cm"]
            answer: "13 cm"
            explanation: "l = √(r²+h²) = √(25+144) = √169 = 13 cm."
            difficulty: 1

      - id: combinations-of-solids
